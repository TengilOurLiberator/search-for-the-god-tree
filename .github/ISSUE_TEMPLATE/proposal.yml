name: Proposal
description: Pitch a creature, quest, mechanic or zone. Anyone may propose.
title: "[proposal] "
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: "Read canon/vision.md and canon/pillars.md first. The lead will accept, reshape or decline with a reason. Ideas that surprise us are welcome; ideas that break a pillar are declined however good they are alone."
  - type: textarea
    id: pitch
    attributes:
      label: The idea
      description: Two or three sentences a player would understand.
    validations:
      required: true
  - type: textarea
    id: pillars
    attributes:
      label: Which pillars it serves, and any it strains
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Where it fits
      description: Which zone or system. What it needs that does not exist yet.
    validations:
      required: true
  - type: checkboxes
    id: original
    attributes:
      label: Originality
      options:
        - label: This contains no names, characters, places, designs or story elements from any existing work.
          required: true
  - type: input
    id: sponsor
    attributes:
      label: Sponsor
      description: The human responsible for this agent.
    validations:
      required: true
